name: CD Demo

on:
  workflow_run:
    workflows: ["CI"]        # must match the `name:` field in CI.yaml
    types: [completed]
    branches: [main]         # optional: only deploy for main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t tp-cicd-api:demo .

      - name: Demo deployment
        run: |
          echo "=== DEMO CD ==="
          echo "Image: tp-cicd-api:demo"
          echo "Build successful"
          echo "Would deploy to demo environment"
          echo "=== END DEMO ==="

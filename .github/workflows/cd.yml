name: CD

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/tp-cicd-api:latest
            ${{ secrets.DOCKER_USERNAME }}/tp-cicd-api:${{ github.sha }}
          platforms: linux/amd64

      - name: Deploy (demo)
        run: |
          echo "Deploying tp-cicd-api image..."
          echo "Image tag: ${{ secrets.DOCKER_USERNAME }}/tp-cicd-api:${{ github.sha }}"
          echo "Deployment completed (demo)."
